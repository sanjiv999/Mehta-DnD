# Global game state. The single place that answers "where are we?"
active_campaign: peacock-throne
party: [sanjiv, partner, arya, keisha]   # character ids currently adventuring together
session_counter: 0                        # total sessions played across all campaigns
last_played: null                         # YYYY-MM-DD
campaign_order: [peacock-throne, moon-road, emberwood, starfall]   # suggested sequence
history: []                               # { campaign, event: started|paused|resumed|completed, date, session }
lantern_pieces: 0                         # cross-campaign artifact progress, 0 to 4
publish_dm_screen: false                  # true: the site also serves the DM screen (notes, secrets, prompts) at /dm/

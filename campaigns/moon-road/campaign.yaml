id: moon-road
title: Lanterns of the Moon Road
tagline: Walk the old pilgrim road through a Japan of spirits, shrines and sleeping dragons, and relight the lanterns one by one.
setting: >-
  A fantasy medieval Japan: a pilgrim road from the sea to a mountain shrine, passing fishing
  towns, bamboo forests, a lake with a dragon under it, a hot-spring village of tanuki, and a
  castle town whose samurai cannot see spirits. The stone lanterns along the road guide the
  mountain spirits home each autumn. This year they are going out.
genre: historical-fantasy
tone: [wonder, quiet, mischief]
status: planned
accent_color: "#c0392b"
art_style: >-
  Ukiyo-e woodblock print influence blended with Studio Ghibli softness: flat colour fields,
  ink outlines, cherry and maple motifs, misty mountains, warm lantern light, expressive
  friendly faces suitable for children.
cover_prompt: A stone lantern glowing on a misty pilgrim road beneath red maples, a small fox watching, a mountain and a torii gate in the distance, ukiyo-e style
level_range: [2, 6]
door: A torii gate at the end of a pier that stands in the sea with no shrine behind it.
lantern_piece: The paper shade, painted by a kitsune who forgot her own name.
map:
  caption: The Moon Road, from the sea to the mountain

name: keepsakes
description: The one item that crosses between worlds.
die: d12
entries:
  - A grandmother's bangle that warms when a friend is near.
  - A feather from a bird nobody has seen twice.
  - A tiny wooden elephant that faces toward home.
  - A marble that shows tomorrow's weather.
  - A whistle only animals can hear.
  - A map with one place missing.
  - A bell that hums toward lost friends.
  - A pebble from the bottom of the sea.
  - A ribbon that cannot be cut.
  - A spoon that makes any soup taste like home.
  - A key with no lock, yet.
  - A drawing of the party, made before they met.

name: hero-seeds
description: Three of these can unstick a player in character creation.
die: d20
entries:
  - A tiger-kin who is afraid of mice and brave about everything else.
  - A tiny fairy with a very big hammer.
  - A kid who inherited a map from a grandparent and a parrot who can read it.
  - A clockwork person who was built to dance and chose to fight.
  - A dragonkin who can only breathe fire when laughing.
  - A ranger whose animal friend is an elephant calf.
  - A bard whose drum scares away thunder.
  - A mage who learned magic from a book they cannot finish.
  - A priest who talks to the moon and the moon talks back, sometimes.
  - A rogue who steals only from villains and gives it to cats.
  - A beast-friend who can turn into a mongoose.
  - An inventor whose gadgets are made of kitchen things.
  - A warrior who carries a shield painted by their little sister.
  - A naga-born who can swim up waterfalls.
  - A kid princess in disguise who is terrible at disguises.
  - A halfling chef whose soup heals.
  - A fairy who collects lost things and knows where everything is.
  - A warrior who is secretly very gentle and has a pet butterfly.
  - A sage who is seven and reads minds, but only of animals.
  - A twin who is looking for the other twin.

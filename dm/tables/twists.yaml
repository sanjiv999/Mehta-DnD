name: twists
description: A twist when the oracle rolls a natural 1 or 20, or when a scene needs a jolt.
die: d12
entries:
  - An old friend appears, in trouble.
  - The thing they were looking for was here all along, in plain sight.
  - An animal arrives with a message.
  - The villain's helper has a change of heart.
  - Weather turns, dramatically.
  - A door opens that should not exist.
  - Someone laughs, and it was the wrong person to laugh.
  - The ground gives way to somewhere wonderful.
  - A child who is not in the party asks for help.
  - A keepsake glows.
  - The enemy is also lost.
  - Music, from nowhere.

name: Generate campaign images
# Manual. Actions → "Generate campaign images" → Run workflow. Opens a pull request with the new
# images so a human approves every picture before it reaches the site.
on:
  workflow_dispatch:
    inputs:
      campaign: { description: "Campaign id (blank = all)", default: "" }
      limit: { description: "Max images this run", default: "6" }
      provider: { description: "openai | stability", default: "openai" }
      heroes: { description: "Also generate missing hero portraits (true/false)", default: "false" }
permissions:
  contents: write
  pull-requests: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
        run: |
          ARGS="--limit ${{ inputs.limit }} --provider ${{ inputs.provider }}"
          if [ -n "${{ inputs.campaign }}" ]; then ARGS="$ARGS --campaign ${{ inputs.campaign }}"; fi
          python tools/images.py generate $ARGS
          if [ "${{ inputs.heroes }}" = "true" ]; then python tools/images.py heroes --limit 4 --provider ${{ inputs.provider }}; fi
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: images/${{ github.run_id }}
          title: "New campaign images (${{ inputs.campaign || 'all' }})"
          commit-message: "Generate campaign images"
          body: "Generated by the images workflow. Review each picture; merge to publish."

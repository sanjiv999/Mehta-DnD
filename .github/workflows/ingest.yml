name: Ingest a session transcript (optional, uses the paid API)
# OPTIONAL. Never runs on its own. The free route is `python tools/ingest.py prompt` + `apply`, or
# asking Claude Code. Run this only if you have added ANTHROPIC_API_KEY as a secret and accept the cost.
on:
  workflow_dispatch:
    inputs:
      transcript: { description: "Path to the transcript", required: true }
permissions:
  contents: write
  pull-requests: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt anthropic pydantic
      - name: Ingest
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          python tools/ingest.py run "${{ inputs.transcript }}"
          python tools/validate.py
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: ingest/${{ github.run_id }}
          title: "Session ingest: ${{ inputs.transcript }}"
          commit-message: "Ingest session transcript"
          body: "Claude's draft of the session log, state and journal updates. Review, fix anything the kids would dispute, merge."
